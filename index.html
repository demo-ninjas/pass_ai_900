<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-900 Exam Prep</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0F172A;--surface:#1E293B;--surface2:#334155;--border:#3F4F65;
--text:#F1F5F9;--text2:#94A3B8;
--accent:#818CF8;--accent2:#6366F1;
--green:#76BA99;--red:#FB7185;--amber:#FF8C42;--purple:#C4B5FD;--pink:#F472B6;
--d1:#818CF8;--d2:#76BA99;--d3:#FF8C42;--d4:#F472B6;--d5:#C4B5FD;
--shadow:0 4px 24px rgba(0,0,0,.3);--shadow-sm:0 2px 8px rgba(0,0,0,.2);
--radius:12px;--sidebar-w:220px;--topbar-h:56px
}
[data-theme="light"]{
--bg:#FDFDFD;--surface:#FFFFFF;--surface2:#F1F5F9;--border:#E2E8F0;
--text:#0F172A;--text2:#64748B;
--accent:#6366F1;--accent2:#4F46E5;
--green:#059669;--red:#DC2626;--amber:#D97706;--purple:#7C3AED;--pink:#DB2777;
--d1:#6366F1;--d2:#059669;--d3:#D97706;--d4:#DB2777;--d5:#7C3AED;
--shadow:0 4px 24px rgba(0,0,0,.06);--shadow-sm:0 2px 8px rgba(0,0,0,.04)
}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
a{color:var(--accent);text-decoration:none}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:200;transition:transform .3s}
.sb-brand{padding:18px 20px;font-weight:700;font-size:1.15rem;color:var(--accent);border-bottom:1px solid var(--border);letter-spacing:-.02em}
.sb-nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.sb-btn{display:flex;align-items:center;gap:12px;padding:10px 16px;border:none;border-radius:8px;background:transparent;color:var(--text2);cursor:pointer;font-size:.88rem;font-family:inherit;transition:.2s;text-align:left}
.sb-btn:hover{background:var(--surface2);color:var(--text)}
.sb-btn.active{background:var(--accent);color:#fff}
.sb-icon{font-size:1.05rem;width:22px;text-align:center}
.sb-label{font-weight:500}

/* TOPBAR */
.topbar{position:fixed;top:0;left:var(--sidebar-w);right:0;height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;z-index:150}
.menu-btn{display:none;padding:6px 10px;border:none;background:transparent;color:var(--text);cursor:pointer;font-size:1.3rem}
.tb-title{font-weight:600;font-size:1.05rem;flex:1}
.tb-right{display:flex;align-items:center;gap:8px}
.tb-btn{padding:5px 10px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text2);cursor:pointer;font-size:.95rem;transition:.2s}
.tb-btn:hover{border-color:var(--text);color:var(--text)}
.xp-badge{padding:4px 14px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;font-size:.78rem;font-weight:600;letter-spacing:.02em}

/* MAIN */
.main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);min-height:calc(100vh - var(--topbar-h))}
.content{max-width:960px;margin:0 auto;padding:28px 24px}
.tab{display:none}.tab.active{display:block}

/* DASHBOARD */
.dash-section{margin-bottom:28px}
.dash-section h2{font-size:1.3rem;margin-bottom:4px;font-weight:700}
.dash-section h3{font-size:1.05rem;margin-bottom:12px;font-weight:600}
.dash-sub{color:var(--text2);font-size:.9rem;margin-bottom:16px}
.flow-cards{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.flow-card{flex:1;min-width:110px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 12px;text-align:center;cursor:pointer;transition:.2s;box-shadow:var(--shadow-sm)}
.flow-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.flow-card .flow-icon{font-size:1.5rem;display:block;margin-bottom:6px}
.flow-card strong{display:block;font-size:.85rem;margin-bottom:2px}
.flow-card span:last-child{font-size:.75rem;color:var(--text2)}
.flow-arrow{color:var(--text2);font-size:1.2rem;font-weight:700}
.dash-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:28px}
.dash-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 14px;text-align:center;box-shadow:var(--shadow-sm)}
.dash-stat .stat-num{font-size:1.7rem;font-weight:700;color:var(--accent)}
.dash-stat .stat-label{font-size:.78rem;color:var(--text2);margin-top:4px}
.stat-ring{position:relative;width:70px;height:70px;margin:0 auto 4px}
.stat-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.stat-ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;color:var(--green)}
.heat-map{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:320px}
.heat-day{width:100%;aspect-ratio:1;border-radius:3px;background:var(--surface2);transition:.2s}
.heat-day.h1{background:color-mix(in srgb,var(--green) 30%,var(--surface2))}.heat-day.h2{background:color-mix(in srgb,var(--green) 55%,var(--surface2))}.heat-day.h3{background:var(--green)}

/* FILTERS */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.filter-btn{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--text2);cursor:pointer;font-size:.82rem;font-family:inherit;transition:.2s}
.filter-btn:hover{border-color:var(--text2)}
.filter-btn.active{color:#fff;border-color:transparent}
.filter-btn[data-d="1"].active{background:var(--d1)}.filter-btn[data-d="2"].active{background:var(--d2)}
.filter-btn[data-d="3"].active{background:var(--d3)}.filter-btn[data-d="4"].active{background:var(--d4)}
.filter-btn[data-d="5"].active{background:var(--d5)}.filter-btn[data-d="all"].active{background:var(--accent)}

/* FLASHCARDS */
.fc-controls{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.fc-progress{font-size:.85rem;color:var(--text2)}
.fc-bar{width:100%;height:6px;background:var(--surface2);border-radius:3px;margin-bottom:20px;overflow:hidden}
.fc-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.card-scene{perspective:900px;width:100%;max-width:620px;margin:0 auto 24px;min-height:280px}
.card-flip{width:100%;min-height:280px;position:relative;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.card-flip.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;min-height:280px;backface-visibility:hidden;border-radius:16px;padding:36px 28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:var(--shadow)}
.card-front{background:var(--surface);border:1px solid var(--border)}
.card-back{background:var(--surface2);border:1px solid var(--border);transform:rotateY(180deg)}
.card-domain{font-size:.72rem;padding:4px 12px;border-radius:12px;color:#fff;margin-bottom:14px;font-weight:600}
.card-q{font-size:1.2rem;font-weight:600;line-height:1.55}
.card-a{font-size:1.05rem;line-height:1.55;color:var(--text)}
.card-num{font-size:.75rem;color:var(--text2);margin-top:14px}
.fc-actions{display:flex;gap:12px;justify-content:center;margin-bottom:20px}
.fc-btn{padding:12px 28px;border:none;border-radius:10px;font-size:1rem;cursor:pointer;font-weight:600;font-family:inherit;transition:.2s}
.btn-again{background:var(--red);color:#fff}.btn-again:hover{opacity:.85}
.btn-got{background:var(--green);color:#fff}.btn-got:hover{opacity:.85}
.btn-star{background:var(--amber);color:#fff;padding:12px 16px}.btn-star:hover{opacity:.85}
.fc-mode{display:flex;gap:8px;flex-wrap:wrap}
.fc-mode-btn{padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text2);cursor:pointer;font-size:.82rem;font-family:inherit;transition:.2s}
.fc-mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* QUIZ */
.quiz-setup{text-align:center;padding:40px 0}
.quiz-setup h2{margin-bottom:12px;font-size:1.4rem}
.quiz-setup p{color:var(--text2);margin-bottom:24px}
.quiz-opt{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.quiz-opt button{padding:12px 24px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);cursor:pointer;font-size:1rem;font-family:inherit;transition:.2s}
.quiz-opt button:hover{border-color:var(--accent)}
.quiz-opt button.active{border-color:var(--accent);background:var(--accent);color:#fff}
.quiz-start{padding:14px 40px;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;font-size:1.05rem;font-weight:600;font-family:inherit;transition:.2s}
.quiz-start:hover{background:var(--accent2)}.quiz-start:disabled{opacity:.4;cursor:not-allowed}
.quiz-q{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.quiz-q h3{margin-bottom:16px;font-size:1.05rem;line-height:1.55;word-wrap:break-word}
.quiz-q .opts label{display:block;padding:12px 16px;margin-bottom:8px;border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:.2s}
.quiz-q .opts label:hover{border-color:var(--text2)}
.quiz-q .opts label.selected{border-color:var(--accent);background:rgba(99,102,241,.1)}
.quiz-q .opts label.correct{border-color:var(--green);background:rgba(118,186,153,.15)}
.quiz-q .opts label.wrong{border-color:var(--red);background:rgba(251,113,133,.12)}
.quiz-q .explanation{margin-top:16px;padding:16px;background:var(--surface2);border-radius:10px;font-size:.92rem;line-height:1.6;color:var(--text2)}
.quiz-score{text-align:center;padding:32px;background:var(--surface);border-radius:16px;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.quiz-score h2{font-size:2rem;margin-bottom:8px}
.quiz-score .pass{color:var(--green)}.quiz-score .fail{color:var(--red)}
.quiz-score p{color:var(--text2);margin-bottom:20px}
.quiz-nav{display:flex;gap:12px;justify-content:center;margin-top:16px}
.quiz-nav button{padding:10px 24px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);cursor:pointer;font-family:inherit;transition:.2s}
.quiz-nav button:hover{border-color:var(--accent)}
.quiz-pbar{width:100%;height:6px;background:var(--surface2);border-radius:3px;margin-bottom:20px;overflow:hidden}
.quiz-pbar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}

/* MIND MAPS */
.mm-section{margin-bottom:16px}
.mm-header{display:flex;align-items:center;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:.2s;box-shadow:var(--shadow-sm)}
.mm-header:hover{border-color:var(--text2);transform:translateY(-1px)}
.mm-header h3{flex:1;font-size:1rem}
.mm-header .arrow{transition:transform .3s;color:var(--text2)}
.mm-header.open .arrow{transform:rotate(90deg)}
.mm-body{display:none;margin-top:8px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.mm-body.open{display:block}
.mm-body svg{width:100%;height:600px}
.mm-body svg text{fill:var(--text)!important;font-size:14px!important}
.mm-body svg .markmap-link{stroke-opacity:.6!important}

/* PROGRESS */
.prog-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.prog-card h3{font-size:1rem;margin-bottom:12px}
.prog-bar-wrap{margin-bottom:12px}
.prog-bar-label{display:flex;justify-content:space-between;font-size:.82rem;color:var(--text2);margin-bottom:5px}
.prog-bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.prog-bar-fill{height:100%;border-radius:4px;transition:width .3s}
.prog-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center;box-shadow:var(--shadow-sm)}
.stat-card .stat-num{font-size:1.8rem;font-weight:700;color:var(--accent)}
.stat-card .stat-label{font-size:.82rem;color:var(--text2)}
.btn-reset{padding:10px 24px;border:1px solid var(--red);border-radius:8px;background:transparent;color:var(--red);cursor:pointer;font-size:.9rem;font-family:inherit;transition:.2s}
.btn-reset:hover{background:var(--red);color:#fff}

/* CHEATSHEETS */
.cs-search{width:100%;padding:10px 16px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:.92rem;font-family:inherit;margin-bottom:16px;outline:none;transition:.2s}
.cs-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.cs-search::placeholder{color:var(--text2)}
.cs-section{margin-bottom:12px}
.cs-header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:.2s;box-shadow:var(--shadow-sm)}
.cs-header:hover{border-color:var(--text2)}
.cs-header h3{flex:1;font-size:.95rem}
.cs-body{display:none;padding:20px;background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;margin-top:-12px;font-size:.9rem;line-height:1.7}
.cs-body.open{display:block}
.cs-body table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.85rem;display:block;overflow-x:auto}
.cs-body th,.cs-body td{padding:8px 12px;border:1px solid var(--border);text-align:left;white-space:nowrap}
.cs-body th{background:var(--surface2);font-weight:600}
.cs-body h4{margin:16px 0 8px;color:var(--accent);font-size:.95rem}
.cs-body ul{padding-left:20px;margin:8px 0}
.cs-body strong{color:var(--accent)}

/* ZEN MODE */
body.zen .sidebar{transform:translateX(-100%)}
body.zen .topbar{left:0}
body.zen .topbar .tb-title,body.zen .topbar .xp-badge{display:none}
body.zen .main{margin-left:0}

/* MOBILE */
@media(max-width:768px){
.sidebar{top:auto;bottom:0;left:0;right:0;width:100%;height:60px;flex-direction:row;border-right:none;border-top:1px solid var(--border)}
.sb-brand{display:none}
.sb-nav{flex-direction:row;padding:4px 8px;gap:0;justify-content:space-around;align-items:center}
.sb-btn{flex-direction:column;gap:2px;padding:6px 8px;font-size:.65rem;align-items:center;justify-content:center}
.sb-icon{font-size:1.15rem;width:auto}
.sb-label{font-size:.6rem}
.topbar{left:0}
.main{margin-left:0;margin-bottom:60px}
.content{padding:16px 14px}
.card-face{padding:24px 16px;min-height:240px}.card-q{font-size:1rem}.card-a{font-size:.95rem}
.fc-btn{padding:10px 20px;font-size:.9rem}
.flow-arrow{display:none}
.flow-cards{gap:6px}
.flow-card{min-width:70px;padding:12px 8px}
body.zen .sidebar{transform:translateY(100%)}
body.zen .main{margin-bottom:0}
.menu-btn{display:none}
}
</style>
</head>

<script>
// ========== DATA ==========
const DOMAINS=[
{id:1,name:"AI Workloads & Considerations",weight:"15â€“20%",color:"var(--d1)"},
{id:2,name:"Machine Learning on Azure",weight:"15â€“20%",color:"var(--d2)"},

];
const FLASHCARDS=[
{id:1,d:1,q:"What are the 5 common AI workload types?",a:"Computer Vision, NLP, Document Processing, Generative AI, Knowledge Mining"},
{id:2,d:1,q:"Which AI workload: 'Detect defective parts on an assembly line from camera images'?",a:"Computer Vision (object detection)"},
{id:3,d:1,q:"Which AI workload: 'Determine if customer reviews are positive or negative'?",a:"NLP (sentiment analysis)"},
{id:4,d:1,q:"Which AI workload: 'Extract line items from scanned invoices'?",a:"Document Processing"},
{id:5,d:1,q:"Which AI workload: 'Generate marketing copy for a product'?",a:"Generative AI"},
{id:6,d:1,q:"Which AI workload: 'Search across thousands of PDF documents'?",a:"Knowledge Mining"},
{id:7,d:1,q:"Which AI workload: 'Convert a recorded meeting to text'?",a:"NLP (speech recognition / STT)"},
{id:8,d:1,q:"Which AI workload: 'Read handwritten text from a form'?",a:"Document Processing (OCR)"},
{id:9,d:1,q:"Name all 6 Responsible AI principles.",a:"Fairness, Reliability & Safety, Privacy & Security, Inclusiveness, Transparency, Accountability"},
{id:10,d:1,q:"Which Responsible AI principle: 'Model produces biased results against a demographic group'?",a:"Fairness"},
{id:11,d:1,q:"Which Responsible AI principle: 'Users don't know they're interacting with an AI'?",a:"Transparency"},
{id:12,d:1,q:"Which Responsible AI principle: 'No human reviews the AI's decisions'?",a:"Accountability"},
{id:13,d:1,q:"Which Responsible AI principle: 'AI crashes under unexpected input'?",a:"Reliability & Safety"},
{id:14,d:1,q:"Which Responsible AI principle: 'User data stored without consent'?",a:"Privacy & Security"},
{id:15,d:1,q:"Which Responsible AI principle: 'AI voice assistant doesn't work for users with speech disabilities'?",a:"Inclusiveness"},
{id:16,d:1,q:"Does Fairness mean treating everyone identically?",a:"No. It means the model doesn't produce biased OUTCOMES for different groups."},
{id:17,d:1,q:"Who is accountable for AI system decisions â€” the AI or people?",a:"People. Humans must oversee AI and ensure governance."},
{id:18,d:1,q:"Does Transparency mean open-sourcing the model?",a:"No. It means users understand how the system makes decisions and its limitations."},
{id:19,d:1,q:"Difference between Computer Vision and Document Processing?",a:"CV analyzes images/video generally. Document Processing extracts STRUCTURED data from forms/invoices."},
{id:20,d:1,q:"What is Knowledge Mining?",a:"Extracting insights from large volumes of unstructured data â€” indexing and searching documents (Azure AI Search)."},
{id:21,d:1,q:"Name an Azure tool for Responsible AI assessment.",a:"Responsible AI dashboard in Azure Machine Learning."},
{id:22,d:1,q:"Which AI workload: 'Identify the breed of a dog in a photo'?",a:"Computer Vision (image classification)"},
{id:23,d:1,q:"Which AI workload: 'Translate an email from Spanish to English'?",a:"NLP (translation)"},
{id:24,d:1,q:"Which AI workload: 'Create a new image from a text description'?",a:"Generative AI (image generation)"},
{id:25,d:1,q:"Which AI workload: 'Extract vendor name and total from a receipt'?",a:"Document Processing"},
{id:26,d:2,q:"What are the 3 core ML techniques for the exam?",a:"Regression, Classification, Clustering"},
{id:27,d:2,q:"What does Regression predict?",a:"A continuous NUMERIC value (how much, how many)."},
{id:28,d:2,q:"What does Classification predict?",a:"A discrete CATEGORY (which one, yes/no)."},
{id:29,d:2,q:"What does Clustering do?",a:"Groups similar data points together WITHOUT predefined labels."},
{id:30,d:2,q:"Is Regression supervised or unsupervised?",a:"Supervised (requires labeled data)."},
{id:31,d:2,q:"Is Classification supervised or unsupervised?",a:"Supervised (requires labeled data)."},
{id:32,d:2,q:"Is Clustering supervised or unsupervised?",a:"Unsupervised (no labels needed)."},
{id:33,d:2,q:"'Predict the selling price of a house' â€” which ML technique?",a:"Regression (predicting a number)."},
{id:34,d:2,q:"'Predict whether a loan will default' â€” which ML technique?",a:"Classification (binary: yes/no)."},
{id:35,d:2,q:"'Group customers by similar purchasing behavior' â€” which technique?",a:"Clustering (finding natural groups, no labels)."},
{id:36,d:2,q:"'Predict how many units will sell next month' â€” technique?",a:"Regression (predicting a number)."},
{id:37,d:2,q:"'Determine if an email is spam or not' â€” technique?",a:"Classification (binary)."},
{id:38,d:2,q:"'Predict a student's test score' â€” technique?",a:"Regression (score is a number)."},
{id:39,d:2,q:"'Predict whether a student will pass or fail' â€” technique?",a:"Classification (pass/fail = categories)."},
{id:40,d:2,q:"'Segment website visitors into groups by behavior' â€” technique?",a:"Clustering (no predefined groups)."},
{id:41,d:2,q:"What is a FEATURE in machine learning?",a:"An input variable used for prediction (e.g., square footage, age, income)."},
{id:42,d:2,q:"What is a LABEL in machine learning?",a:"The output variable being predicted (e.g., price, spam/not-spam)."},
{id:43,d:2,q:"Does clustering use labels?",a:"No. Clustering is unsupervised â€” uses only features."},
{id:44,d:2,q:"What is the TRAINING dataset used for?",a:"Teaching the model â€” it learns patterns from this data."},
{id:45,d:2,q:"What is the VALIDATION dataset used for?",a:"Tuning the model during training and checking for overfitting."},
{id:46,d:2,q:"What is the TEST dataset used for?",a:"Evaluating the final model on completely unseen data."},
{id:47,d:2,q:"What is OVERFITTING?",a:"Model memorizes training data but performs poorly on new data."},
{id:48,d:2,q:"What is UNDERFITTING?",a:"Model is too simple to capture patterns â€” poor on all data."},
{id:49,d:2,q:"What is Deep Learning?",a:"Subset of ML using neural networks with multiple layers. Excels at unstructured data (images, text, audio)."},
{id:50,d:2,q:"Deep learning vs traditional ML: which needs more data/compute?",a:"Deep learning requires MORE data and MORE compute."},
{id:51,d:2,q:"What is the Transformer architecture?",a:"Architecture using self-attention to process all input simultaneously. Foundation of LLMs (GPT, BERT)."},
{id:52,d:2,q:"What does GPT stand for?",a:"Generative Pre-trained Transformer."},
{id:53,d:2,q:"What is Automated ML (AutoML)?",a:"Azure ML feature that automatically tries multiple algorithms and hyperparameters. No coding needed."},
{id:54,d:2,q:"What 3 task types does AutoML support?",a:"Classification, Regression, Time-series forecasting."},
{id:55,d:2,q:"What is Azure ML Designer?",a:"Drag-and-drop visual interface for building ML pipelines without code."},
{id:56,d:2,q:"What data and compute services does Azure ML provide?",a:"Datastores (Blob, Data Lake, SQL), data assets (versioned references), compute instances (dev), compute clusters (scalable training), serverless compute."},
{id:57,d:2,q:"What is the Azure ML model registry?",a:"Central repo to register, version, and track trained models. Supports lineage, tagging, and staging before deployment."},
{id:58,d:2,q:"How do you deploy models in Azure ML?",a:"Managed online endpoints (real-time REST APIs, autoscaling, blue/green), batch endpoints (large-scale offline), or deploy to Kubernetes."},
{id:59,d:3,q:"What are the 4 computer vision task types on the exam?",a:"Image Classification, Object Detection, OCR, Facial Detection/Analysis."},
{id:60,d:3,q:"What does Image Classification do?",a:"Assigns a category label to an ENTIRE image ('this is a cat')."},
{id:61,d:3,q:"What does Object Detection do?",a:"Identifies objects AND their LOCATIONS (bounding boxes) in an image."},
{id:62,d:3,q:"What does OCR do?",a:"Extracts printed or handwritten text from images."},
{id:63,d:3,q:"What does Facial Detection do?",a:"Detects face LOCATIONS in images; can analyze attributes (glasses, head pose)."},
{id:64,d:3,q:"Key difference: Image Classification vs Object Detection?",a:"Classification = one label for whole image. Object Detection = multiple objects + WHERE (bounding boxes)."},
{id:65,d:3,q:"'Count the number of cars in a parking lot photo' â€” which CV task?",a:"Object Detection (needs to find each car)."},
{id:66,d:3,q:"'Determine if a photo contains a cat or dog' â€” which CV task?",a:"Image Classification (one label for the whole image)."},
{id:67,d:3,q:"'Read the text on a street sign' â€” which CV task?",a:"OCR."},
{id:68,d:3,q:"'Determine if a person is wearing glasses' â€” which CV task?",a:"Facial Detection/Analysis."},
{id:69,d:3,q:"What are the 3 Azure services for computer vision?",a:"Azure AI Vision, Azure AI Face, Azure AI Document Intelligence."},
{id:70,d:3,q:"What does Azure AI Vision provide?",a:"Image analysis, captions, tags, OCR (Read API), object detection, spatial analysis, smart cropping."},
{id:71,d:3,q:"What does Azure AI Face provide?",a:"Face detection, attributes, verification (1:1), identification (1:many)."},
{id:72,d:3,q:"What does Azure AI Document Intelligence provide?",a:"Extract structured data from documents: key-value pairs, tables, line items. Pre-built models for invoices, receipts, IDs."},
{id:73,d:3,q:"OCR vs Document Intelligence: when to use which?",a:"OCR = raw text from any image. Document Intelligence = STRUCTURED fields from forms/invoices."},
{id:74,d:3,q:"Face Verification vs Face Identification?",a:"Verification = 2 faces, same person? (1:1). Identification = who from a group? (1:many)."},
{id:75,d:3,q:"What facial capability did Microsoft RETIRE for Responsible AI?",a:"Inferring emotional states from facial expressions."},
{id:76,d:3,q:"Does Azure AI Face still detect if someone wears glasses?",a:"Yes â€” attribute analysis (glasses, head pose, blur) is still available."},
{id:77,d:3,q:"Does face identification require special approval?",a:"Yes â€” requires Limited Access approval from Microsoft."},
{id:78,d:3,q:"What is Image Captioning in Azure AI Vision?",a:"Generates human-readable text descriptions of images (useful for alt text)."},
{id:79,d:3,q:"What is Spatial Analysis in Azure AI Vision?",a:"Analyzes people movement in video feeds â€” count, proximity, tracking."},
{id:80,d:3,q:"'Generate alt-text for website images' â€” which service?",a:"Azure AI Vision (Image Captioning)."},
{id:81,d:3,q:"'Extract vendor name, date, total from scanned invoices' â€” service?",a:"Azure AI Document Intelligence."},
{id:82,d:3,q:"'Verify identity by comparing selfie to badge photo' â€” service?",a:"Azure AI Face (face verification, 1:1)."},
{id:83,d:3,q:"'Count people entering a store from video' â€” service?",a:"Azure AI Vision (Spatial Analysis)."},
{id:84,d:4,q:"What are the 7 NLP capabilities tested on the exam?",a:"Key phrase extraction, entity recognition, sentiment analysis, language modeling, speech recognition, speech synthesis, translation."},
{id:85,d:4,q:"What does Key Phrase Extraction do?",a:"Identifies main concepts/topics in text (flat list of phrases)."},
{id:86,d:4,q:"What does Entity Recognition (NER) do?",a:"Identifies and CATEGORIZES named entities (Person, Org, Location, Date)."},
{id:87,d:4,q:"What does Sentiment Analysis do?",a:"Determines emotional tone: positive, negative, neutral per sentence and overall."},
{id:88,d:4,q:"Key Phrase Extraction vs Entity Recognition?",a:"Key phrases = important topics (no categories). NER = entities WITH categories (Person, Org, Location)."},
{id:89,d:4,q:"What is Opinion Mining?",a:"Aspect-based sentiment: links sentiment to specific aspects ('food: positive, service: negative')."},
{id:90,d:4,q:"What is Speech-to-Text (STT)?",a:"Converts spoken audio into written text."},
{id:91,d:4,q:"What is Text-to-Speech (TTS)?",a:"Converts written text into spoken audio."},
{id:92,d:4,q:"What is Speech Translation?",a:"Translates spoken audio in one language to another (speech-to-speech)."},
{id:93,d:4,q:"What is Azure AI Translator?",a:"Translates WRITTEN text between languages (not audio)."},
{id:94,d:4,q:"'Translate a written document from French to English' â€” service?",a:"Azure AI Translator (text translation)."},
{id:95,d:4,q:"'Translate a live spoken conversation' â€” service?",a:"Azure AI Speech (speech translation). NOT Azure AI Translator."},
{id:96,d:4,q:"What is Azure AI Language?",a:"Text analytics service: sentiment, key phrases, NER, entity linking, language detection, summarization, CLU, QA."},
{id:97,d:4,q:"What is Azure AI Speech?",a:"Audio service: STT, TTS, speech translation, speaker recognition, keyword recognition."},
{id:98,d:4,q:"Name 6 pre-built features of Azure AI Language.",a:"Sentiment analysis, key phrase extraction, NER, entity linking, language detection, text summarization."},
{id:99,d:4,q:"Name 4 custom features of Azure AI Language.",a:"Question Answering, CLU, custom text classification, custom entity recognition."},
{id:100,d:4,q:"Pre-built vs Custom: which works without training data?",a:"Pre-built features work immediately with no training data."},
{id:101,d:4,q:"What is Question Answering in Azure AI Language?",a:"Build a knowledge base from FAQs/docs â†’ answers user questions from that content."},
{id:102,d:4,q:"What is CLU (Conversational Language Understanding)?",a:"Train a model to understand user INTENTS and extract ENTITIES from conversational input."},
{id:103,d:4,q:"Question Answering vs CLU?",a:"QA = answers from a knowledge base. CLU = understands intents and entities in commands/conversation."},
{id:104,d:4,q:"'Build a FAQ bot from company handbook' â€” feature?",a:"Question Answering."},
{id:105,d:4,q:"'Understand: book a flight to Paris on Friday' â€” feature?",a:"CLU (intent: BookFlight, entities: destination=Paris, date=Friday)."},
{id:106,d:4,q:"'Analyze if product reviews are positive or negative' â€” service?",a:"Azure AI Language â€” Sentiment Analysis (pre-built)."},
{id:107,d:4,q:"'Detect what language an email is written in' â€” service?",a:"Azure AI Language â€” Language Detection (pre-built)."},
{id:108,d:4,q:"'Transcribe a call center recording' â€” service?",a:"Azure AI Speech â€” Speech-to-Text."},
{id:109,d:4,q:"'Read articles aloud for visually impaired users' â€” service?",a:"Azure AI Speech â€” Text-to-Speech."},
{id:110,d:4,q:"'Summarize a long support conversation' â€” service?",a:"Azure AI Language â€” Text Summarization (pre-built)."},
{id:111,d:4,q:"What is language modeling in NLP?",a:"Predicting the next word/token in a sequence. Foundation for text generation, auto-complete, chatbots, and LLMs like GPT."},
{id:112,d:5,q:"What is Generative AI?",a:"AI that creates NEW content (text, images, code, audio) â€” powered by LLMs."},
{id:113,d:5,q:"What are LLMs?",a:"Large Language Models â€” trained on massive text data to understand and generate human language."},
{id:114,d:5,q:"What architecture underpins modern LLMs?",a:"Transformer architecture (self-attention, parallel processing)."},
{id:115,d:5,q:"What does the GPT model family generate?",a:"Text, code, reasoning."},
{id:116,d:5,q:"What does DALL-E generate?",a:"Images from text descriptions."},
{id:117,d:5,q:"What does Whisper do?",a:"Speech-to-text (transcription)."},
{id:118,d:5,q:"What are Embeddings models?",a:"Create vector (numeric) representations of text â€” used for similarity search."},
{id:119,d:5,q:"What is a TOKEN in generative AI?",a:"A unit of text (word or subword) that models process."},
{id:120,d:5,q:"What is a PROMPT?",a:"The input text you send to a generative AI model."},
{id:121,d:5,q:"What is a COMPLETION?",a:"The model's generated response to a prompt."},
{id:122,d:5,q:"What does TEMPERATURE control?",a:"Randomness/creativity. 0 = deterministic/focused. 1 = creative/random."},
{id:123,d:5,q:"Temperature for code generation?",a:"Low (0 to 0.3) â€” consistent, reliable output."},
{id:124,d:5,q:"Temperature for creative writing?",a:"High (0.7 to 1.0) â€” diverse, creative output."},
{id:125,d:5,q:"What is a SYSTEM MESSAGE?",a:"Instructions that set model behavior, persona, constraints (e.g., 'You are a helpful Azure support agent')."},
{id:126,d:5,q:"What is ZERO-SHOT learning?",a:"Instructions with NO examples in the prompt."},
{id:127,d:5,q:"What is FEW-SHOT learning?",a:"A FEW examples (2â€“5) in the prompt to demonstrate desired behavior."},
{id:128,d:5,q:"What is RAG (Retrieval-Augmented Generation)?",a:"Retrieve relevant docs, include in prompt â€” grounds model in real data to reduce hallucinations."},
{id:129,d:5,q:"What is a HALLUCINATION in AI?",a:"When a model generates confident but factually incorrect information."},
{id:130,d:5,q:"Primary technique to reduce hallucinations?",a:"RAG â€” ground responses in retrieved factual documents."},
{id:131,d:5,q:"What is FINE-TUNING?",a:"Additional training on your specific data to customize the model."},
{id:132,d:5,q:"System message vs Fine-tuning?",a:"System message = quick behavioral rules at inference. Fine-tuning = deep customization through additional training."},
{id:133,d:5,q:"What is Azure OpenAI Service?",a:"Microsoft's managed service for OpenAI models with enterprise security and compliance."},
{id:134,d:5,q:"Azure OpenAI vs public OpenAI: data privacy?",a:"Azure: data NOT used for training. Public: may be used unless opted out."},
{id:135,d:5,q:"Azure OpenAI vs public OpenAI: networking?",a:"Azure: private endpoints/VNets. Public: internet only."},
{id:136,d:5,q:"What is Azure AI Foundry?",a:"Unified portal: model catalog, playground, prompt flow, evaluation, deployment."},
{id:137,d:5,q:"What is the Azure AI Foundry Model Catalog?",a:"Browse/deploy models from OpenAI, Meta (Llama), Mistral, Microsoft (Phi), Hugging Face."},
{id:138,d:5,q:"What are the 4 content filter categories in Azure OpenAI?",a:"Violence, Hate, Sexual, Self-harm."},
{id:139,d:5,q:"Are Azure OpenAI content filters applied to input, output, or both?",a:"BOTH â€” prompts (input) AND completions (output)."},
{id:140,d:5,q:"What are the 4 content filter severity levels in Azure OpenAI?",a:"Safe, Low, Medium, High."},
{id:141,d:5,q:"Can you disable Azure OpenAI content filters?",a:"Only with Microsoft approval through a Limited Access application."},
{id:142,d:5,q:"What is Chain of Thought prompting?",a:"Ask the model to explain reasoning step by step â€” improves accuracy on complex tasks."},
{id:143,d:5,q:"When should you use Embeddings models?",a:"Semantic search, finding similar documents, comparing text by meaning (not keyword matching)."},
{id:144,d:5,q:"Can you rename an Azure AI resource after creation?",a:"No â€” name and region are immutable. Must delete and recreate."},
{id:145,d:5,q:"How long does Azure OpenAI retain data for abuse monitoring?",a:"30 days by default. Can be reduced/removed with Microsoft approval."},
{id:146,d:5,q:"GPT-4 vs GPT-4o: key difference?",a:"GPT-4o is optimized â€” faster and cheaper with similar capabilities. GPT-4o mini is smallest/cheapest."}

const MINDMAPS=[
{id:1,title:"AI Workloads & Responsible AI",color:"var(--d1)",md:`# AI Workloads & Considerations\n## AI Workload Types\n### Computer Vision\n- Image classification\n- Object detection\n- OCR\n- Facial detection\n### NLP\n- Sentiment analysis\n- Key phrase extraction\n- Entity recognition\n- Speech recognition/synthesis\n- Translation\n### Document Processing\n- Invoice/receipt extraction\n- ID document processing\n- Custom form extraction\n### Generative AI\n- Text generation (GPT)\n- Image generation (DALL-E)\n- Code generation\n- Conversational AI\n### Knowledge Mining\n- Azure AI Search\n- Index & search documents\n## Responsible AI Principles\n### Fairness\n- No biased outcomes\n- Equal treatment across groups\n### Reliability & Safety\n- Works under expected conditions\n- Handles edge cases\n### Privacy & Security\n- Data protection\n- Access controls\n### Inclusiveness\n- Accessible to all\n- Regardless of disability\n### Transparency\n- Users understand decisions\n- Disclose AI interactions\n### Accountability\n- HUMANS oversee AI\n- Governance frameworks`},
{id:2,title:"Machine Learning on Azure",color:"var(--d2)",md:`# Machine Learning on Azure\n## ML Techniques\n### Regression (Supervised)\n- Predicts numbers\n- Price, temperature, count\n### Classification (Supervised)\n- Predicts categories\n- Binary: yes/no, spam/not\n- Multi-class: type A/B/C\n### Clustering (Unsupervised)\n- Groups similar data\n- No predefined labels\n- Customer segmentation\n## Core Concepts\n### Features & Labels\n- Feature = input variable\n- Label = what you predict\n- Clustering has NO label\n### Dataset Splits\n- Training set (learn patterns)\n- Validation set (tune/prevent overfit)\n- Test set (final evaluation)\n### Deep Learning\n- Neural networks, multiple layers\n- More data, more compute\n- Best for images, text, audio\n### Transformer Architecture\n- Self-attention mechanism\n- Parallel processing\n- Foundation of GPT, BERT\n## Azure ML Capabilities\n### AutoML\n- No code required\n- Tries multiple algorithms\n- Classification, Regression, Forecasting\n### Designer\n- Drag-and-drop visual ML\n### Notebooks\n- Custom Python/R code\n### Deployment\n- Managed online endpoints\n- Batch endpoints\n- Model registry`},
{id:3,title:"Computer Vision on Azure",color:"var(--d3)",md:`# Computer Vision on Azure\n## Task Types\n### Image Classification\n- One label for whole image\n- "This is a cat"\n### Object Detection\n- Objects + bounding boxes\n- "Car at (x,y,w,h)"\n- Can count objects\n### OCR\n- Extract text from images\n- Printed & handwritten\n- Read API\n### Facial Detection\n- Face locations\n- Attributes: glasses, head pose\n- Verification (1:1)\n- Identification (1:many)\n## Azure Services\n### Azure AI Vision\n- Image analysis & captions\n- OCR (Read API)\n- Object detection\n- Spatial analysis (video)\n- Smart cropping\n### Azure AI Face\n- Face detection\n- Face attributes\n- Face verification (1:1)\n- Face identification (1:many, approval required)\n- Emotion detection RETIRED\n### Azure AI Document Intelligence\n- Structured extraction\n- Pre-built: invoices, receipts, IDs\n- Custom models\n- Key-value pairs & tables`},
{id:4,title:"NLP on Azure",color:"var(--d4)",md:`# NLP on Azure\n## NLP Capabilities\n### Key Phrase Extraction\n- Main topics (flat list)\n### Entity Recognition (NER)\n- Entities WITH categories\n- Person, Org, Location, Date\n### Sentiment Analysis\n- Positive / Negative / Neutral\n- Opinion mining (aspect-based)\n### Speech Recognition (STT)\n- Audio to Text\n### Speech Synthesis (TTS)\n- Text to Audio\n### Translation\n- Text: Azure AI Translator\n- Speech: Azure AI Speech\n## Azure Services\n### Azure AI Language\n#### Pre-built (no training)\n- Sentiment analysis\n- Key phrase extraction\n- NER & entity linking\n- Language detection\n- Text summarization\n#### Custom (your data)\n- Question Answering\n- CLU (intents + entities)\n- Custom classification\n- Custom NER\n### Azure AI Speech\n- Speech-to-Text\n- Text-to-Speech\n- Speech Translation\n- Speaker Recognition\n- Keyword Recognition\n- Intent Recognition\n### Azure AI Translator\n- Text translation\n- Document translation`},
{id:5,title:"Generative AI on Azure",color:"var(--d5)",md:`# Generative AI on Azure\n## Models\n### GPT\n- Text, code, reasoning\n- GPT-3.5, GPT-4, GPT-4o\n### DALL-E\n- Images from text\n### Whisper\n- Speech-to-text\n### Embeddings\n- Vector representations\n- Similarity search\n## Key Concepts\n### Prompts & Completions\n- Prompt = input\n- Completion = output\n- Token = unit of text\n### Temperature\n- 0 = deterministic\n- 1 = creative/random\n- Code: low, Creative: high\n### Prompt Engineering\n- System message (set persona)\n- Zero-shot (no examples)\n- Few-shot (2-5 examples)\n- Chain of thought\n### Grounding & RAG\n- RAG reduces hallucinations\n- Retrieve docs then add to prompt\n- Primary anti-hallucination technique\n### Fine-Tuning\n- Additional training on your data\n- Deep domain customization\n- vs System message (quick rules)\n## Azure Services\n### Azure OpenAI Service\n- Enterprise security\n- Data NOT used for training\n- Private endpoints / VNets\n- Content filters (4 categories)\n- Violence, Hate, Sexual, Self-harm\n- Severity levels: Safe, Low, Medium, High\n- Data retained 30 days for abuse monitoring\n### Azure AI Foundry\n- Unified AI development portal\n- Model Catalog (multi-provider)\n- Playground (test prompts)\n- Prompt Flow (LLM pipelines)\n- Evaluation & deployment`}

function updateThemeIcon(){document.getElementById('theme-toggle').textContent=document.documentElement.getAttribute('data-theme')==='light'?'â˜€ï¸':'ðŸŒ™'}
document.getElementById('theme-toggle').addEventListener('click',()=>{
const l=document.documentElement.getAttribute('data-theme')==='light';
if(l)document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme','light');
store.set('theme',l?'dark':'light');updateThemeIcon();
document.querySelectorAll('.mm-body svg text').forEach(t=>{t.style.fill=getComputedStyle(document.documentElement).getPropertyValue('--text').trim()});
});

// ========== XP ==========
let xp=store.get('xp',0);
function addXP(n){xp+=n;store.set('xp',xp);document.getElementById('xp-badge').textContent=xp+' XP'}
document.getElementById('xp-badge').textContent=xp+' XP';

// ========== ACTIVITY ==========
let activity=store.get('activity',{});
function trackActivity(){const d=new Date().toISOString().slice(0,10);activity[d]=(activity[d]||0)+1;store.set('activity',activity)}

// ========== ZEN MODE ==========
document.getElementById('zen-toggle').addEventListener('click',()=>{document.body.classList.toggle('zen')});

// ========== STATE ==========
let starred=store.get('starred',{});
let mastered=store.get('mastered',{});
let reviews=store.get('reviews',0);
let quizHistory=store.get('quizHistory',[]);
let streak=store.get('streak',{days:0,last:null});
let fcDomain='all',fcMode='all',fcIdx=0,fcDeck=[];
let qzDomain='all',qzLen=10,qzActive=false,qzIdx=0,qzScore=0,qzAnswered=[],qzQuestions=[];
let csDomain='all';
function save(){store.set('starred',starred);store.set('mastered',mastered);store.set('reviews',reviews);store.set('quizHistory',quizHistory);store.set('streak',streak)}
function updateStreak(){const today=new Date().toDateString();if(streak.last!==today){if(streak.last){const d=new Date(streak.last);d.setDate(d.getDate()+1);streak.days=d.toDateString()===today?streak.days+1:1}else{streak.days=1}streak.last=today;save()}}

// ========== NAV ==========
const tabNames={dashboard:'Dashboard',flashcards:'Flashcards',quiz:'Quiz',mindmaps:'Mind Maps',cheatsheets:'Cheat Sheets',progress:'Progress'};
function switchTab(id){
document.querySelectorAll('.sb-btn').forEach(x=>x.classList.remove('active'));
const btn=document.querySelector(`.sb-btn[data-tab="${id}"]`);if(btn)btn.classList.add('active');
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.getElementById(id).classList.add('active');
document.getElementById('tb-title').textContent=tabNames[id]||id;
if(id==='dashboard')renderDashboard();
if(id==='progress')renderProgress();
if(id==='mindmaps')initMindmaps();
}
document.querySelectorAll('.sb-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));

// ========== DASHBOARD ==========
function renderDashboard(){
const totalCards=FLASHCARDS.length,mc=Object.keys(mastered).length,sc=Object.keys(starred).length;
const pct=Math.round(mc/totalCards*100),ls=quizHistory.length?quizHistory[quizHistory.length-1].score+'%':'â€”';
document.getElementById('dashboard').innerHTML=`
<div class="dash-section"><h2>Study Flow</h2><p class="dash-sub">Follow this path for optimal retention</p>
<div class="flow-cards">
<div class="flow-card" data-tab="mindmaps"><span class="flow-icon">ðŸ§ </span><strong>Explore</strong><span>Mind Maps</span></div><div class="flow-arrow">â†’</div>
<div class="flow-card" data-tab="cheatsheets"><span class="flow-icon">ðŸ“–</span><strong>Review</strong><span>Cheat Sheets</span></div><div class="flow-arrow">â†’</div>
<div class="flow-card" data-tab="flashcards"><span class="flow-icon">ðŸ—‚ï¸</span><strong>Practice</strong><span>Flashcards</span></div><div class="flow-arrow">â†’</div>
<div class="flow-card" data-tab="quiz"><span class="flow-icon">â“</span><strong>Validate</strong><span>Quiz</span></div>
</div></div>
<div class="dash-stats">
<div class="dash-stat"><div class="stat-ring"><svg viewBox="0 0 36 36"><path d="M18 2.0845a15.9155 15.9155 0 010 31.831 15.9155 15.9155 0 010-31.831" fill="none" stroke="var(--surface2)" stroke-width="3"/><path d="M18 2.0845a15.9155 15.9155 0 010 31.831 15.9155 15.9155 0 010-31.831" fill="none" stroke="var(--green)" stroke-width="3" stroke-dasharray="${pct},100" stroke-linecap="round"/></svg><span>${pct}%</span></div><div class="stat-label">Mastery</div></div>
<div class="dash-stat"><div class="stat-num">${mc}/${totalCards}</div><div class="stat-label">Cards Mastered</div></div>
<div class="dash-stat"><div class="stat-num">${sc}</div><div class="stat-label">Need Review</div></div>
<div class="dash-stat"><div class="stat-num">${streak.days} ðŸ”¥</div><div class="stat-label">Day Streak</div></div>
<div class="dash-stat"><div class="stat-num">${xp}</div><div class="stat-label">XP Earned</div></div>
<div class="dash-stat"><div class="stat-num">${ls}</div><div class="stat-label">Last Quiz</div></div>
</div>
<div class="dash-section"><h3>30-Day Activity</h3><div class="heat-map" id="heat-map"></div></div>
<div class="dash-section"><h3>Domain Mastery</h3>${DOMAINS.map(d=>{
const dc=FLASHCARDS.filter(c=>c.d===d.id),dm=dc.filter(c=>mastered[c.id]).length,p=dc.length?Math.round(dm/dc.length*100):0;
return`<div class="prog-bar-wrap"><div class="prog-bar-label"><span>D${d.id}: ${d.name}</span><span>${dm}/${dc.length} (${p}%)</span></div><div class="prog-bar"><div class="prog-bar-fill" style="width:${p}%;background:${d.color}"></div></div></div>`}).join('')}</div>`;
renderHeatMap();
document.querySelectorAll('.flow-card[data-tab]').forEach(c=>c.addEventListener('click',()=>switchTab(c.dataset.tab)));
}
function renderHeatMap(){
const el=document.getElementById('heat-map');if(!el)return;
const today=new Date();let html='';
for(let i=34;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10);const v=activity[k]||0;
const cls=v===0?'':v<=5?'h1':v<=15?'h2':'h3';
html+=`<div class="heat-day ${cls}" title="${k}: ${v} reviews"></div>`}
el.innerHTML=html;
}

// ========== FILTERS ==========
function buildFilters(cid,onChange){
const c=document.getElementById(cid);
c.innerHTML='<button class="filter-btn active" data-d="all">All</button>'+DOMAINS.map(d=>`<button class="filter-btn" data-d="${d.id}">D${d.id}: ${d.name}</button>`).join('');
c.querySelectorAll('.filter-btn').forEach(b=>b.addEventListener('click',()=>{
c.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');onChange(b.dataset.d==='all'?'all':+b.dataset.d)}));
}

// ========== FLASHCARDS ==========
function buildFcDeck(){let c=FLASHCARDS;if(fcDomain!=='all')c=c.filter(x=>x.d===fcDomain);if(fcMode==='starred')c=c.filter(x=>starred[x.id]);if(fcMode==='unmastered')c=c.filter(x=>!mastered[x.id]);fcDeck=c;fcIdx=0}
function renderCard(){
const f=document.getElementById('card-flip');f.classList.remove('flipped');
if(!fcDeck.length){document.getElementById('card-q').textContent=fcMode==='starred'?'No starred cards. Keep studying!':'No cards match filters.';document.getElementById('card-a').textContent='';document.getElementById('card-domain').textContent='';document.getElementById('card-num').textContent='';document.getElementById('fc-count').textContent='0 / 0';document.getElementById('fc-bar').style.width='0%';return}
if(fcIdx>=fcDeck.length)fcIdx=0;const c=fcDeck[fcIdx],d=DOMAINS.find(x=>x.id===c.d);
document.getElementById('card-domain').textContent=d.name;document.getElementById('card-domain').style.background=d.color;
document.getElementById('card-q').textContent=c.q;document.getElementById('card-a').textContent=c.a;
document.getElementById('card-num').textContent=`Card ${fcIdx+1} of ${fcDeck.length}`;
document.getElementById('fc-count').textContent=`${fcIdx+1} / ${fcDeck.length}`;
document.getElementById('fc-bar').style.width=((fcIdx+1)/fcDeck.length*100)+'%';
document.getElementById('btn-star').textContent=starred[c.id]?'â˜… Starred':'â­ Star';
}
document.getElementById('card-flip').addEventListener('click',()=>document.getElementById('card-flip').classList.toggle('flipped'));
document.getElementById('btn-again').addEventListener('click',()=>{if(!fcDeck.length)return;const c=fcDeck[fcIdx];starred[c.id]=true;delete mastered[c.id];reviews++;addXP(5);trackActivity();updateStreak();save();fcIdx++;renderCard()});
document.getElementById('btn-got').addEventListener('click',()=>{if(!fcDeck.length)return;const c=fcDeck[fcIdx];mastered[c.id]=true;reviews++;addXP(5);trackActivity();updateStreak();save();fcIdx++;renderCard()});
document.getElementById('btn-star').addEventListener('click',()=>{if(!fcDeck.length)return;const c=fcDeck[fcIdx];starred[c.id]=!starred[c.id];save();document.getElementById('btn-star').textContent=starred[c.id]?'â˜… Starred':'â­ Star'});
buildFilters('fc-filters',d=>{fcDomain=d;buildFcDeck();renderCard()});
document.querySelectorAll('.fc-mode-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.fc-mode-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');fcMode=b.dataset.mode;buildFcDeck();renderCard()}));
buildFcDeck();renderCard();

// ========== QUIZ ==========
function showQuizSetup(){qzActive=false;const a=document.getElementById('quiz-area');
a.innerHTML=`<div class="quiz-setup"><h2>Practice Quiz</h2><p>Test your knowledge across all AI-900 domains</p><div class="quiz-opt" id="qz-len"><button data-n="10" class="active">10 Questions</button><button data-n="25">25 Questions</button></div><button class="quiz-start" id="qz-start">Start Quiz</button></div>`;
a.querySelectorAll('#qz-len button').forEach(b=>b.addEventListener('click',()=>{a.querySelectorAll('#qz-len button').forEach(x=>x.classList.remove('active'));b.classList.add('active');qzLen=+b.dataset.n}));
a.querySelector('#qz-start').addEventListener('click',startQuiz)}
function startQuiz(){let p=QUIZ_QUESTIONS.slice();if(qzDomain!=='all')p=p.filter(q=>q.d===qzDomain);for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}qzQuestions=p.slice(0,Math.min(qzLen,p.length));qzIdx=0;qzScore=0;qzAnswered=new Array(qzQuestions.length).fill(-1);qzActive=true;renderQuizQ()}
function renderQuizQ(){if(qzIdx>=qzQuestions.length){showQuizScore();return}const q=qzQuestions[qzIdx],d=DOMAINS.find(x=>x.id===q.d),a=document.getElementById('quiz-area'),pct=qzIdx/qzQuestions.length*100;
a.innerHTML=`<div class="quiz-pbar"><div class="quiz-pbar-fill" style="width:${pct}%"></div></div><div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:.85rem;color:var(--text2)"><span style="padding:3px 10px;border-radius:12px;background:${d.color};color:#fff;font-size:.75rem">${d.name}</span><span>Question ${qzIdx+1} of ${qzQuestions.length}</span></div><div class="quiz-q"><h3>${q.q}</h3><div class="opts">${q.opts.map((o,i)=>`<label data-i="${i}"><input type="radio" name="qopt" style="display:none" value="${i}"> ${String.fromCharCode(65+i)}) ${o}</label>`).join('')}</div><div class="explanation" id="qz-exp" style="display:none"></div></div><div class="quiz-nav"><button id="qz-next" style="display:none">Next â†’</button></div>`;
if(qzAnswered[qzIdx]>=0){showAnswer(q,qzAnswered[qzIdx]);return}
a.querySelectorAll('.opts label').forEach(l=>l.addEventListener('click',()=>{if(qzAnswered[qzIdx]>=0)return;const i=+l.dataset.i;qzAnswered[qzIdx]=i;if(i===q.ans)qzScore++;addXP(10);trackActivity();showAnswer(q,i);updateStreak();save()}))}
function showAnswer(q,ch){const a=document.getElementById('quiz-area');a.querySelectorAll('.opts label').forEach(l=>{const i=+l.dataset.i;if(i===q.ans)l.classList.add('correct');else if(i===ch)l.classList.add('wrong');l.classList.add('selected')});const e=a.querySelector('#qz-exp');e.style.display='block';e.innerHTML=`<strong>${ch===q.ans?'âœ“ Correct!':'âœ— Incorrect.'}</strong> ${q.exp}`;const n=a.querySelector('#qz-next');n.style.display='inline-block';n.addEventListener('click',()=>{qzIdx++;renderQuizQ()})}
function showQuizScore(){const p=Math.round(qzScore/qzQuestions.length*100),pass=p>=70;quizHistory.push({score:p,date:new Date().toISOString(),total:qzQuestions.length,correct:qzScore});save();const a=document.getElementById('quiz-area');a.innerHTML=`<div class="quiz-score"><h2 class="${pass?'pass':'fail'}">${p}%</h2><p>${qzScore} / ${qzQuestions.length} correct â€” ${pass?'PASS âœ“':'FAIL âœ—'} (70% needed)</p><div class="quiz-nav"><button id="qz-review">Review Answers</button><button id="qz-retry">New Quiz</button></div></div>`;a.querySelector('#qz-retry').addEventListener('click',showQuizSetup);a.querySelector('#qz-review').addEventListener('click',()=>{qzIdx=0;renderQuizQ()})}
buildFilters('qz-filters',d=>{qzDomain=d;showQuizSetup()});showQuizSetup();

// ========== MIND MAPS ==========
let mmInited=false;const mmRendered={};
function loadScript(u){return new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)})}
let mmDeps=null;
function loadMM(){if(!mmDeps)mmDeps=loadScript('https://cdn.jsdelivr.net/npm/d3@7').then(()=>loadScript('https://cdn.jsdelivr.net/npm/markmap-view')).then(()=>loadScript('https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/dist/browser/index.iife.js'));return mmDeps}
function renderOneMM(id){if(mmRendered[id])return;const m=MINDMAPS.find(x=>x.id===id);if(!m)return;const b=document.getElementById('mm-body-'+id);if(!b)return;b.innerHTML='<p style="padding:20px;color:var(--text2)">Loading mind mapâ€¦</p>';
loadMM().then(()=>{const{Transformer,Markmap}=window.markmap;const{root}=new Transformer().transform(m.md);b.innerHTML='';const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.style.width='100%';svg.style.height='600px';b.appendChild(svg);const mm=Markmap.create(svg,{initialExpandLevel:-1},root);setTimeout(()=>mm.fit(),100);mmRendered[id]=true}).catch(e=>{b.innerHTML='<p style="padding:20px;color:var(--red)">Failed to load mind map.<br><small>'+e+'</small></p>'})}
function initMindmaps(){if(mmInited)return;mmInited=true;const a=document.getElementById('mm-area');a.innerHTML='';
MINDMAPS.forEach(m=>{const s=document.createElement('div');s.className='mm-section';const h=document.createElement('div');h.className='mm-header';h.dataset.id=m.id;h.innerHTML=`<span class="arrow">â–¶</span><h3 style="color:${m.color}">${m.title}</h3><span style="font-size:.8rem;color:var(--text2)">D${m.id}</span>`;const b=document.createElement('div');b.className='mm-body';b.id='mm-body-'+m.id;s.appendChild(h);s.appendChild(b);a.appendChild(s)});
a.querySelectorAll('.mm-header').forEach(h=>h.addEventListener('click',()=>{h.classList.toggle('open');const b=document.getElementById('mm-body-'+h.dataset.id);b.classList.toggle('open');if(b.classList.contains('open'))renderOneMM(+h.dataset.id)}))}

// ========== PROGRESS ==========
function renderProgress(){const tc=FLASHCARDS.length,mc=Object.keys(mastered).length,sc=Object.keys(starred).length,ls=quizHistory.length?quizHistory[quizHistory.length-1].score+'%':'â€”';
document.getElementById('prog-stats').innerHTML=`<div class="stat-card"><div class="stat-num">${mc}</div><div class="stat-label">Cards Mastered</div></div><div class="stat-card"><div class="stat-num">${sc}</div><div class="stat-label">Cards Starred</div></div><div class="stat-card"><div class="stat-num">${reviews}</div><div class="stat-label">Total Reviews</div></div><div class="stat-card"><div class="stat-num">${ls}</div><div class="stat-label">Last Quiz</div></div><div class="stat-card"><div class="stat-num">${streak.days}</div><div class="stat-label">Day Streak ðŸ”¥</div></div><div class="stat-card"><div class="stat-num">${quizHistory.length}</div><div class="stat-label">Quizzes Taken</div></div>`;
document.getElementById('prog-bars').innerHTML='<div class="prog-card"><h3>Mastery by Domain</h3>'+DOMAINS.map(d=>{const dc=FLASHCARDS.filter(c=>c.d===d.id),dm=dc.filter(c=>mastered[c.id]).length,p=dc.length?Math.round(dm/dc.length*100):0;return`<div class="prog-bar-wrap"><div class="prog-bar-label"><span>D${d.id}: ${d.name}</span><span>${dm}/${dc.length} (${p}%)</span></div><div class="prog-bar"><div class="prog-bar-fill" style="width:${p}%;background:${d.color}"></div></div></div>`}).join('')+'</div>'}
document.getElementById('btn-reset').addEventListener('click',()=>{if(!confirm('Reset ALL progress? This cannot be undone.'))return;starred={};mastered={};reviews=0;quizHistory=[];streak={days:0,last:null};xp=0;activity={};store.set('xp',0);store.set('activity',{});save();renderProgress();buildFcDeck();renderCard();document.getElementById('xp-badge').textContent='0 XP'});

// ========== CHEATSHEETS ==========
function renderCheatsheets(domain,search){
let sheets=domain==='all'?CHEATSHEETS:CHEATSHEETS.filter(s=>s.d===domain);
if(search){const q=search.toLowerCase();sheets=sheets.filter(s=>s.title.toLowerCase().includes(q)||s.content.toLowerCase().includes(q))}
const a=document.getElementById('cs-area');
a.innerHTML=sheets.length?sheets.map((s,i)=>{const d=DOMAINS.find(x=>x.id===s.d);return`<div class="cs-section"><div class="cs-header" data-i="${i}"><span class="arrow" style="color:var(--text2)">â–¶</span><h3><span style="color:${d.color};font-size:.8rem;margin-right:8px">D${s.d}</span>${s.title}</h3></div><div class="cs-body" id="cs-body-${i}">${s.content}</div></div>`}).join(''):'<p style="color:var(--text2);text-align:center;padding:40px">No sections match your search.</p>';
a.querySelectorAll('.cs-header').forEach(h=>h.addEventListener('click',()=>{const b=document.getElementById('cs-body-'+h.dataset.i);b.classList.toggle('open');h.querySelector('.arrow').textContent=b.classList.contains('open')?'â–¼':'â–¶'}))}
buildFilters('cs-filters',d=>{csDomain=d;renderCheatsheets(d,document.getElementById('cs-search').value)});
document.getElementById('cs-search').addEventListener('input',e=>renderCheatsheets(csDomain,e.target.value));
renderCheatsheets('all','');

// ========== KEYBOARD ==========
document.addEventListener('keydown',e=>{if(!document.getElementById('flashcards').classList.contains('active'))return;if(e.key===' '||e.key==='Enter'){e.preventDefault();document.getElementById('card-flip').classList.toggle('flipped')}if(e.key==='ArrowLeft')document.getElementById('btn-again').click();if(e.key==='ArrowRight')document.getElementById('btn-got').click();if(e.key==='s')document.getElementById('btn-star').click()});

// ========== INIT ==========
renderDashboard();
</script>
</body>
</html>
